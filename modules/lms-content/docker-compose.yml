# lms-content — standalone deployable slice of documentiulia (REQ-043).
# Own database, own Redis, own JWT secret, own port. Same backend image as the
# platform; only the lms_content/compliance module graph is bootstrapped
# (dist/main-lms-content.js — see backend/src/standalone/lms_content-app.module.ts).
name: lms-content

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lms_content
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lms_content}
      POSTGRES_DB: lms_content
    volumes:
      - lms_content_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_content"]
      interval: 5s
      timeout: 5s
      retries: 10
    # REQ-048: cap container logs — nothing rotated them
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    # REQ-048: stateful containers must come back after a host reboot
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - lms_content_redis:/data
    # REQ-048: cap container logs — nothing rotated them
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    # REQ-048: stateful containers must come back after a host reboot
    restart: unless-stopped

  api:
    build: ../../backend
    command: sh -c "npx prisma migrate deploy && node dist/main-lms-content"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lms_content:${DB_PASSWORD:-lms_content}@db:5432/lms_content?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      LMS_PORT: "3110"
      PORT: "3110"
      NODE_ENV: production
    ports:
      - "127.0.0.1:3110:3110"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3110/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    # REQ-048: cap container logs — nothing rotated them
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

volumes:
  lms_content_pgdata:
  lms_content_redis:
