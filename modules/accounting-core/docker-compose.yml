# accounting-core — standalone deployable slice of documentiulia (REQ-043).
# Own database, own Redis, own JWT secret, own port. Same backend image as the
# platform; only the accounting/compliance module graph is bootstrapped
# (dist/main-accounting.js — see backend/src/standalone/accounting-app.module.ts).
name: accounting-core

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: ${DB_PASSWORD:-accounting}
      POSTGRES_DB: accounting
    volumes:
      - accounting_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting"]
      interval: 5s
      timeout: 5s
      retries: 10
    # REQ-048: cap container logs — nothing rotated them
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    # REQ-048: stateful containers must come back after a host reboot
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - accounting_redis:/data
    # REQ-048: cap container logs — nothing rotated them
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    # REQ-048: stateful containers must come back after a host reboot
    restart: unless-stopped

  api:
    build: ../../backend
    command: sh -c "npx prisma migrate deploy && node dist/main-accounting"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://accounting:${DB_PASSWORD:-accounting}@db:5432/accounting?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ACCOUNTING_PORT: "3102"
      PORT: "3102"
      NODE_ENV: production
    ports:
      - "127.0.0.1:3102:3102"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3102/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    # REQ-048: cap container logs — nothing rotated them
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

volumes:
  accounting_pgdata:
  accounting_redis:
