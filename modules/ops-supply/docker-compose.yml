# ops-supply — standalone deployable slice of documentiulia (REQ-043).
# Own database, own Redis, own JWT secret, own port. Same backend image as the
# platform; only the ops_supply/compliance module graph is bootstrapped
# (dist/main-ops-supply.js — see backend/src/standalone/ops_supply-app.module.ts).
name: ops-supply

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ops_supply
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ops_supply}
      POSTGRES_DB: ops_supply
    volumes:
      - ops_supply_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_supply"]
      interval: 5s
      timeout: 5s
      retries: 10
    # REQ-048: cap container logs — nothing rotated them
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    # REQ-048: stateful containers must come back after a host reboot
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ops_supply_redis:/data
    # REQ-048: cap container logs — nothing rotated them
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    # REQ-048: stateful containers must come back after a host reboot
    restart: unless-stopped

  api:
    build: ../../backend
    command: sh -c "npx prisma migrate deploy && node dist/main-ops-supply"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ops_supply:${DB_PASSWORD:-ops_supply}@db:5432/ops_supply?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OPS_PORT: "3107"
      PORT: "3107"
      NODE_ENV: production
    ports:
      - "127.0.0.1:3107:3107"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3107/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    # REQ-048: cap container logs — nothing rotated them
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

volumes:
  ops_supply_pgdata:
  ops_supply_redis:
