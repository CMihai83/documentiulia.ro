# hr-payroll — standalone deployable slice of documentiulia (REQ-043).
# Own database, own Redis, own JWT secret, own port. Same backend image as the
# platform; only the hr_payroll/compliance module graph is bootstrapped
# (dist/main-hr-payroll.js — see backend/src/standalone/hr_payroll-app.module.ts).
name: hr-payroll

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hr_payroll
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hr_payroll}
      POSTGRES_DB: hr_payroll
    volumes:
      - hr_payroll_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_payroll"]
      interval: 5s
      timeout: 5s
      retries: 10
    # REQ-048: cap container logs — nothing rotated them
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    # REQ-048: stateful containers must come back after a host reboot
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - hr_payroll_redis:/data
    # REQ-048: cap container logs — nothing rotated them
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    # REQ-048: stateful containers must come back after a host reboot
    restart: unless-stopped

  api:
    build: ../../backend
    command: sh -c "npx prisma migrate deploy && node dist/main-hr-payroll"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hr_payroll:${DB_PASSWORD:-hr_payroll}@db:5432/hr_payroll?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      HR_PORT: "3103"
      PORT: "3103"
      NODE_ENV: production
    ports:
      - "127.0.0.1:3103:3103"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3103/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    # REQ-048: cap container logs — nothing rotated them
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

volumes:
  hr_payroll_pgdata:
  hr_payroll_redis:
