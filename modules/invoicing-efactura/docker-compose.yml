# invoicing-efactura — standalone deployable slice of documentiulia (REQ-043).
# Own database, own Redis, own JWT secret, own port. Same backend image as the
# platform; only the invoicing/compliance module graph is bootstrapped
# (dist/main-invoicing.js — see backend/src/standalone/invoicing-app.module.ts).
name: invoicing-efactura

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoicing
      POSTGRES_PASSWORD: ${DB_PASSWORD:-invoicing}
      POSTGRES_DB: invoicing
    volumes:
      - invoicing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoicing"]
      interval: 5s
      timeout: 5s
      retries: 10
    # REQ-048: cap container logs — nothing rotated them
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    # REQ-048: stateful containers must come back after a host reboot
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - invoicing_redis:/data
    # REQ-048: cap container logs — nothing rotated them
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    # REQ-048: stateful containers must come back after a host reboot
    restart: unless-stopped

  api:
    build: ../../backend
    command: sh -c "npx prisma migrate deploy && node dist/main-invoicing"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://invoicing:${DB_PASSWORD:-invoicing}@db:5432/invoicing?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      INVOICING_PORT: "3101"
      PORT: "3101"
      NODE_ENV: production
    ports:
      - "127.0.0.1:3101:3101"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3101/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    # REQ-048: cap container logs — nothing rotated them
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

volumes:
  invoicing_pgdata:
  invoicing_redis:
