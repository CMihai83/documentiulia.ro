# docs-ai — standalone deployable slice of documentiulia (REQ-043).
# Own database, own Redis, own JWT secret, own port. Same backend image as the
# platform; only the docs_ai/compliance module graph is bootstrapped
# (dist/main-docs-ai.js — see backend/src/standalone/docs_ai-app.module.ts).
name: docs-ai

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docs_ai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-docs_ai}
      POSTGRES_DB: docs_ai
    volumes:
      - docs_ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docs_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - docs_ai_redis:/data

  api:
    build: ../../backend
    command: sh -c "npx prisma migrate deploy && node dist/main-docs-ai"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://docs_ai:${DB_PASSWORD:-docs_ai}@db:5432/docs_ai?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DOCS_PORT: "3105"
      PORT: "3105"
      NODE_ENV: production
    ports:
      - "127.0.0.1:3105:3105"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3105/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  docs_ai_pgdata:
  docs_ai_redis:
