# compliance-hub — standalone deployable slice of documentiulia (REQ-043).
# Own database, own Redis, own JWT secret, own port. Same backend image as the
# platform; only the compliance_hub/compliance module graph is bootstrapped
# (dist/main-compliance-hub.js — see backend/src/standalone/compliance_hub-app.module.ts).
name: compliance-hub

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: compliance_hub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-compliance_hub}
      POSTGRES_DB: compliance_hub
    volumes:
      - compliance_hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
    # REQ-048: cap container logs — nothing rotated them
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    # REQ-048: stateful containers must come back after a host reboot
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - compliance_hub_redis:/data
    # REQ-048: cap container logs — nothing rotated them
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    # REQ-048: stateful containers must come back after a host reboot
    restart: unless-stopped

  api:
    build: ../../backend
    command: sh -c "npx prisma migrate deploy && node dist/main-compliance-hub"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://compliance_hub:${DB_PASSWORD:-compliance_hub}@db:5432/compliance_hub?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      COMPLIANCE_PORT: "3104"
      PORT: "3104"
      NODE_ENV: production
    ports:
      - "127.0.0.1:3104:3104"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3104/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    # REQ-048: cap container logs — nothing rotated them
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

volumes:
  compliance_hub_pgdata:
  compliance_hub_redis:
