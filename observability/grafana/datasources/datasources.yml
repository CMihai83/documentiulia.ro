# Grafana Datasources Configuration for DocumentIulia.ro

apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Elasticsearch
    orgId: 1
  - name: Jaeger
    orgId: 1

datasources:
  #############################################################################
  # PROMETHEUS - Metrics Datasource
  #############################################################################
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    uid: prometheus
    url: http://prometheus:9090
    basicAuth: false
    isDefault: true
    version: 1
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 60s
      defaultRegion: eu-west-1
      customQueryParameters: ''

  #############################################################################
  # ELASTICSEARCH - Logs Datasource
  #############################################################################
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    orgId: 1
    uid: elasticsearch
    url: http://elasticsearch:9200
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    jsonData:
      esVersion: '8.11.0'
      timeField: '@timestamp'
      interval: Daily
      logMessageField: message
      logLevelField: level
      maxConcurrentShardRequests: 5
      includeFrozen: false
    database: 'documentiulia-logs-*'

  #############################################################################
  # ELASTICSEARCH - Errors Datasource
  #############################################################################
  - name: Elasticsearch-Errors
    type: elasticsearch
    access: proxy
    orgId: 1
    uid: elasticsearch-errors
    url: http://elasticsearch:9200
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    jsonData:
      esVersion: '8.11.0'
      timeField: '@timestamp'
      interval: Daily
      logMessageField: message
      logLevelField: level
      maxConcurrentShardRequests: 5
      includeFrozen: false
    database: 'documentiulia-errors-*'

  #############################################################################
  # ELASTICSEARCH - ANAF Compliance Logs
  #############################################################################
  - name: Elasticsearch-ANAF
    type: elasticsearch
    access: proxy
    orgId: 1
    uid: elasticsearch-anaf
    url: http://elasticsearch:9200
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    jsonData:
      esVersion: '8.11.0'
      timeField: '@timestamp'
      interval: Daily
      logMessageField: message
      logLevelField: level
      maxConcurrentShardRequests: 5
      includeFrozen: false
    database: 'documentiulia-anaf-*'

  #############################################################################
  # JAEGER - Distributed Tracing Datasource
  #############################################################################
  - name: Jaeger
    type: jaeger
    access: proxy
    orgId: 1
    uid: jaeger
    url: http://jaeger:16686
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: 'elasticsearch'
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
        filterBySpanID: false
        tags: ['correlationId']
