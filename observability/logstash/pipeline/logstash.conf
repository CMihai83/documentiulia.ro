# Logstash Pipeline Configuration for DocumentIulia.ro
# Processes logs from NestJS backend, frontend, and external integrations

input {
  # TCP input for application logs
  tcp {
    port => 5000
    codec => json_lines
    tags => ["app"]
  }

  # UDP input for high-throughput logs
  udp {
    port => 5000
    codec => json_lines
    tags => ["app"]
  }

  # Beats input for filebeat/metricbeat
  beats {
    port => 5044
    tags => ["beats"]
  }

  # HTTP input for webhook logs
  http {
    port => 8080
    tags => ["webhook"]
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }

  # Add timestamp
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }

  # Extract correlation ID for distributed tracing
  if [correlationId] {
    mutate {
      add_field => { "trace_id" => "%{correlationId}" }
    }
  }

  # Categorize log levels
  if [level] {
    mutate {
      lowercase => ["level"]
    }

    if [level] == "error" {
      mutate {
        add_tag => ["error"]
        add_field => { "severity" => "high" }
      }
    } else if [level] == "warn" {
      mutate {
        add_tag => ["warning"]
        add_field => { "severity" => "medium" }
      }
    } else if [level] == "info" {
      mutate {
        add_tag => ["info"]
        add_field => { "severity" => "low" }
      }
    }
  }

  # Extract ANAF-specific logs
  if [context] == "ANAF" {
    mutate {
      add_tag => ["anaf", "compliance"]
      add_field => { "integration" => "anaf" }
    }
  }

  # Extract database query logs
  if [context] == "Database" {
    mutate {
      add_tag => ["database"]
    }

    # Flag slow queries
    if [duration] {
      ruby {
        code => "
          duration_ms = event.get('duration').to_s.gsub('ms', '').to_f
          if duration_ms > 100
            event.set('slow_query', true)
            event.tag('slow_query')
          end
        "
      }
    }
  }

  # Extract HTTP logs
  if [type] == "request" or [type] == "response" {
    mutate {
      add_tag => ["http"]
    }

    # Extract HTTP method and status
    if [method] {
      mutate {
        add_field => { "http_method" => "%{method}" }
      }
    }

    if [statusCode] {
      mutate {
        add_field => { "http_status" => "%{statusCode}" }
      }
    }

    # Flag slow responses
    if [duration] {
      ruby {
        code => "
          duration_ms = event.get('duration').to_s.gsub('ms', '').to_f
          if duration_ms > 1000
            event.set('slow_response', true)
            event.tag('slow_response')
          end
        "
      }
    }
  }

  # Extract security events
  if [context] == "Security" {
    mutate {
      add_tag => ["security"]
    }

    if [success] == false {
      mutate {
        add_tag => ["security_failure"]
        add_field => { "severity" => "critical" }
      }
    }
  }

  # Geolocate IP addresses
  if [ip] and [ip] != "unknown" and [ip] != "::1" and [ip] != "127.0.0.1" {
    geoip {
      source => "ip"
      target => "geoip"
    }
  }

  # Remove unnecessary fields
  mutate {
    remove_field => ["message", "host"]
  }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "documentiulia-logs-%{+YYYY.MM.dd}"

    # Use correlation ID as document ID for deduplication
    document_id => "%{correlationId}-%{type}"
  }

  # Output errors to separate index
  if "error" in [tags] or [severity] == "high" or [severity] == "critical" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "documentiulia-errors-%{+YYYY.MM.dd}"
    }
  }

  # Output ANAF logs to separate index for compliance
  if "anaf" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "documentiulia-anaf-%{+YYYY.MM.dd}"
    }
  }

  # Output security events to separate index
  if "security" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "documentiulia-security-%{+YYYY.MM.dd}"
    }
  }

  # Debug output (stdout) for development
  if [@metadata][debug] {
    stdout {
      codec => rubydebug
    }
  }
}
